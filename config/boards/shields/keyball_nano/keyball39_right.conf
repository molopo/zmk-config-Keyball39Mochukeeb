CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable raw hardware sensor processing
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y

# CRITICAL FIX FOR DONGLE PERIPHERAL MODE:
# Turn off layer switching, automouse, and smart logic on the peripheral side
CONFIG_PMW3610_SMART_ALGORITHM=n
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=0

# Hardware sensor-level settings are safe to leave
CONFIG_PMW3610_CPI=2000
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
